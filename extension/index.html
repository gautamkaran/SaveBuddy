<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaveBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="message-box" class="message-box"></div>

  <div class="container">
    <div class="header">

      <h1 class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#2563eb" aria-hidden="true">
          <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm-5 10h-2v-2H8v-2h2V7h2v2h2v2h-2v2z" />
        </svg>
        SaveBuddy
      </h1>
      <a href="https://github.com/gautamkaran/SaveBuddy" target="_blank" rel="noopener noreferrer"
        data-tooltip="View on GitHub" class="github-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.67 1.25 3.32.96.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47-.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68.41.35.77 1.04.77 2.1v3.11c0 .31.21.68.8.56A10.99 10.99 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
        </svg>
      </a>
    </div>

    <div class="input-group">
      <input type="text" id="title-el" placeholder="Optional title..." />
      <input type="text" id="url-el" placeholder="Enter URL..." />
    </div>

    <div class="button-group">
      <button id="save-btn" class="save-btn">SAVE LINK</button>
      <button id="save-tab-btn" class="save-btn">SAVE TAB</button>
      <button id="delete-all-btn" class="delete-btn">DELETE ALL</button>
    </div>

    <ul id="link-list"></ul>
  </div>

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <h3 class="modal-title">Confirm Deletion</h3>
      <p class="modal-body">
        Are you sure you want to delete all saved links? This action cannot be
        undone.
      </p>
      <div class="modal-buttons">
        <button id="cancel-btn" class="modal-btn cancel-btn">Cancel</button>
        <button id="confirm-delete-btn" class="modal-btn confirm-btn">
          Delete
        </button>
      </div>
    </div>
  </div>
  <footer class="footer">
    <p>
      Made with ❤️ by
      <a href="https://gautamkaran.com/" target="_blank" rel="noopener noreferrer" class="creator-name">
        Gautam<span>Karan</span>
      </a>
    </p>
  </footer>

  <script src="index.js"></script>
</body>

</html>
