<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveBuddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="message-box" class="message-box"></div>

    <div class="container">
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm-5 10h-2v-2H8v-2h2V7h2v2h2v2h-2v2z" />
            </svg>
            <h1>SaveBuddy</h1>
        </div>

        <div class="input-group">
            <input type="text" id="title-el" placeholder="Optional title...">
            <input type="text" id="url-el" placeholder="Enter URL...">
        </div>

        <div class="button-group">
            <button id="save-btn" class="save-btn">SAVE LINK</button>
            <button id="save-tab-btn" class="save-btn">SAVE TAB</button>
            <button id="delete-all-btn" class="delete-btn">DELETE ALL</button>
        </div>

        <ul id="link-list">
        </ul>
    </div>

    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">Confirm Deletion</h3>
            <p class="modal-body">Are you sure you want to delete all saved links? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button id="cancel-btn" class="modal-btn cancel-btn">Cancel</button>
                <button id="confirm-delete-btn" class="modal-btn confirm-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
