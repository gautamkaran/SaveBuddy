# SaveBuddy Documentation — Jekyll configuration
# Built with the "Just the Docs" theme for GitHub Pages.
# Theme documentation: https://just-the-docs.github.io/just-the-docs/

title: SaveBuddy
description: >-
  Official documentation for SaveBuddy, a lightweight Chrome extension
  for saving and managing useful web links directly from Chrome.

remote_theme: just-the-docs/just-the-docs

# GitHub Pages deployment: <user>.github.io/<repo>
url: "https://gautamkaran.github.io"
baseurl: "/SaveBuddy"

# --- Branding -------------------------------------------------------------

# The sidebar logo (bookmark icon + wordmark) is rendered as inline SVG/HTML
# via `_includes/title.html`, matching the extension popup header.

# --- Navigation / links ---------------------------------------------------

# The GitHub link is rendered as an icon button in `_includes/header_custom.html`.

# Sort sidebar navigation case-insensitively
nav_sort: case_insensitive

# --- Search ---------------------------------------------------------------

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# --- Content --------------------------------------------------------------

# The favicon <link> is emitted explicitly in `_includes/head_custom.html`
# (the theme's `favicon_ico` option only works if the file also happens to be
# present as a static file, which is fragile — see _includes/favicon.html).

heading_anchors: true
permalink: pretty
back_to_top: true
color_scheme: light

# --- Footer ---------------------------------------------------------------

# Footer content is customized via `_includes/footer_custom.html`
# (the `footer_content` config option is deprecated by the theme).

# "Last edited" timestamps + "edit this page" links to GitHub
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/gautamkaran/SaveBuddy"
gh_edit_branch: "docs"
# The site is built from the "docs" folder of the "docs" branch, so page paths
# are already relative to that folder; no source prefix is needed here.
# If the docs are ever merged to "main", switch the branch above to "main".
gh_edit_view_mode: "edit"

# --- Plugins --------------------------------------------------------------

plugins:
  - jekyll-remote-theme
